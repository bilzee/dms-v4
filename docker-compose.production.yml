# Production Docker Compose Configuration
# Optimized for Dokploy / single VPS deployment (4-8GB RAM)
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# Setup:
#   1. Copy .env.production.template to .env.production
#   2. Fill in all REPLACE-WITH-* values with real secrets
#   3. docker compose -f docker-compose.production.yml up -d
#
# Services: PostgreSQL, Redis, MinIO, Next.js app, DB backup sidecar, Traefik

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drms_prod}
      POSTGRES_USER: ${DB_USER:-drms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-drms_user} -d ${POSTGRES_DB:-drms_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - drms_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - drms_internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - drms_internal

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/dms-storage --ignore-existing;
      mc mb myminio/db-backups --ignore-existing;
      echo 'MinIO buckets ready: dms-storage, db-backups';
      "
    networks:
      - drms_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-drms_user}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-drms_prod}?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env.production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env.production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-${NEXTAUTH_URL}/api}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Disaster Response Management System}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-1.0.0}
      - NEXT_PUBLIC_PWA_ENABLED=${NEXT_PUBLIC_PWA_ENABLED:-true}
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${S3_BUCKET:-dms-storage}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENABLED=true
      - SENTRY_ENABLED=${SENTRY_ENABLED:-false}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@dms-borno.gov.ng}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-DRMS Borno}
      - BACKUP_S3_ENABLED=${BACKUP_S3_ENABLED:-false}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY:-}
      - BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - app_reports:/app/reports
      - app_uploads:/app/uploads
      - app_temp:/app/temp
      - app_backups:/app/.backups
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drms.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.drms.entrypoints=websecure"
      - "traefik.http.routers.drms.tls.certresolver=letsencrypt"
      - "traefik.http.services.drms.loadbalancer.server.port=3000"
    networks:
      - drms_internal
      - drms_proxy
      - dokploy-network

  db-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGUSER=${DB_USER:-drms_user}
      - PGPASSWORD=${DB_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-drms_prod}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl;
      curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc;
      chmod +x /usr/local/bin/mc;
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      echo 'Backup service started. Running daily at 2AM UTC.';
      while true; do
        FILENAME=drms_backup_$$(date -u +%Y%m%d_%H%M%S).sql.gz;
        echo \"[$$(date -u)] Starting backup: $$FILENAME\";
        if pg_dump -h $$PGHOST -U $$PGUSER $$PGDATABASE | gzip > /tmp/$$FILENAME; then
          if mc cp /tmp/$$FILENAME myminio/db-backups/$$FILENAME; then
            echo \"[$$(date -u)] Backup uploaded: $$FILENAME\";
            rm -f /tmp/$$FILENAME;
            mc ls myminio/db-backups/ --summarize 2>/dev/null | sort -r | tail -n +31 | awk '{print $$7}' | while read f; do
              [ -n \"$$f\" ] && mc rm \"myminio/db-backups/$$f\" 2>/dev/null || true;
            done;
            echo \"[$$(date -u)] Pruned backups older than 30 days\";
          else
            echo \"[$$(date -u)] ERROR: Upload to MinIO failed\";
            rm -f /tmp/$$FILENAME;
          fi;
        else
          echo \"[$$(date -u)] ERROR: pg_dump failed\";
          rm -f /tmp/$$FILENAME;
        fi;
        sleep 86400;
      done
      "
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - drms_internal

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=drms_proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@localhost}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - drms_proxy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  app_reports:
    driver: local
  app_uploads:
    driver: local
  app_temp:
    driver: local
  app_backups:
    driver: local
  app_logs:
    driver: local
  letsencrypt_data:
    driver: local

networks:
  drms_internal:
    driver: bridge
    name: drms_production_network
  drms_proxy:
    driver: bridge
    name: drms_proxy
  dokploy-network:
    external: true
    name: dokploy-network
